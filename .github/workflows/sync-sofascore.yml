name: Sync La Liga results

on:
  schedule:
    # Ejecutar una vez cada hora
    - cron: "0 * * * *"

  # Permite ejecutarlo manualmente desde Actions
  workflow_dispatch:

concurrency:
  group: laliga-results-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    # Evita que una ejecución se quede colgada
    timeout-minutes: 10

    steps:
      - name: Sync API-Football → Supabase
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: https://mmrctzpiyycgoiqldtlg.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |
          python - <<'PY'

          import json
          import os
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone


          # ============================================================
          # CONFIGURATION
          # ============================================================

          API_KEY = os.environ["API_FOOTBALL_KEY"]

          SUPABASE_URL = os.environ["SUPABASE_URL"]

          SUPABASE_KEY = os.environ["SUPABASE_SERVICE_ROLE_KEY"]

          API_URL = "https://v3.football.api-sports.io"

          # LaLiga
          LEAGUE_ID = 140

          # Season 2026/27
          SEASON = 2026


          # ============================================================
          # API-FOOTBALL
          # ============================================================

          def api_get(endpoint, params):

              query = urllib.parse.urlencode(params)

              url = (
                  API_URL
                  + endpoint
                  + "?"
                  + query
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "x-apisports-key": API_KEY,
                      "Accept": "application/json"
                  },
                  method="GET"
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  return json.loads(
                      response.read().decode()
                  )


          # ============================================================
          # SUPABASE
          # ============================================================

          def supabase_upsert(match):

              url = (
                  SUPABASE_URL
                  + "/rest/v1/matches"
                  + "?on_conflict=api_id"
              )

              headers = {
                  "apikey": SUPABASE_KEY,
                  "Authorization": "Bearer " + SUPABASE_KEY,
                  "Content-Type": "application/json",
                  "Prefer":
                      "resolution=merge-duplicates,"
                      "return=minimal"
              }

              body = json.dumps(match).encode()

              request = urllib.request.Request(
                  url,
                  data=body,
                  headers=headers,
                  method="POST"
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  response.read()


          # ============================================================
          # START
          # ============================================================

          print("")
          print("========================================")
          print("      LA LIGA RESULTS SYNCHRONIZER")
          print("========================================")
          print("")

          print("Consultando API-Football...")
          print(
              f"Competition: LaLiga ({LEAGUE_ID})"
          )
          print(
              f"Season: {SEASON}/27"
          )
          print("")


          # ============================================================
          # GET FIXTURES
          # ============================================================

          data = api_get(
              "/fixtures",
              {
                  "league": LEAGUE_ID,
                  "season": SEASON
              }
          )


          # ============================================================
          # CHECK API ERRORS
          # ============================================================

          api_errors = data.get("errors", {})

          if api_errors:

              raise Exception(
                  "API-Football error: "
                  + json.dumps(api_errors)
              )


          fixtures = data.get(
              "response",
              []
          )


          print(
              f"Partidos recibidos: {len(fixtures)}"
          )

          print("")


          # ============================================================
          # UPDATE MATCHES
          # ============================================================

          updated = 0

          errors = 0


          for fixture in fixtures:

              try:

                  fixture_info = fixture.get(
                      "fixture",
                      {}
                  )

                  teams = fixture.get(
                      "teams",
                      {}
                  )

                  goals = fixture.get(
                      "goals",
                      {}
                  )

                  league = fixture.get(
                      "league",
                      {}
                  )

                  status_info = fixture_info.get(
                      "status",
                      {}
                  )


                  # ----------------------------------------------------
                  # BASIC INFORMATION
                  # ----------------------------------------------------

                  fixture_id = fixture_info.get(
                      "id"
                  )

                  if not fixture_id:
                      continue


                  home_team = (
                      teams
                      .get("home", {})
                      .get("name")
                  )

                  away_team = (
                      teams
                      .get("away", {})
                      .get("name")
                  )


                  # ----------------------------------------------------
                  # SCORE
                  # ----------------------------------------------------

                  home_score = goals.get(
                      "home"
                  )

                  away_score = goals.get(
                      "away"
                  )


                  # ----------------------------------------------------
                  # STATUS
                  # ----------------------------------------------------

                  api_status = status_info.get(
                      "short",
                      "NS"
                  )


                  if api_status in [
                      "FT",
                      "AET",
                      "PEN"
                  ]:

                      db_status = "FINISHED"


                  elif api_status in [
                      "1H",
                      "HT",
                      "2H",
                      "ET",
                      "BT",
                      "P"
                  ]:

                      db_status = "IN_PLAY"


                  elif api_status == "PST":

                      db_status = "POSTPONED"


                  elif api_status == "CANC":

                      db_status = "CANCELED"


                  else:

                      db_status = "SCHEDULED"


                  # ----------------------------------------------------
                  # DATE
                  # ----------------------------------------------------

                  timestamp = fixture_info.get(
                      "timestamp"
                  )


                  if timestamp:

                      utc_date = (
                          datetime.fromtimestamp(
                              timestamp,
                              timezone.utc
                          )
                          .isoformat()
                      )

                  else:

                      utc_date = fixture_info.get(
                          "date"
                      )


                  # ----------------------------------------------------
                  # MATCHDAY
                  # ----------------------------------------------------

                  round_name = league.get(
                      "round",
                      ""
                  )

                  matchday = None


                  if "-" in round_name:

                      try:

                          matchday = int(
                              round_name
                              .split("-")[-1]
                              .strip()
                          )

                      except ValueError:

                          matchday = None


                  # ----------------------------------------------------
                  # SUPABASE OBJECT
                  # ----------------------------------------------------

                  match = {

                      "api_id":
                          fixture_id,

                      "matchday":
                          matchday,

                      "home_team":
                          home_team,

                      "away_team":
                          away_team,

                      "utc_date":
                          utc_date,

                      "status":
                          db_status,

                      "home_score":
                          home_score,

                      "away_score":
                          away_score,

                      "updated_at":
                          datetime.now(
                              timezone.utc
                          ).isoformat()
                  }


                  # ----------------------------------------------------
                  # SAVE
                  # ----------------------------------------------------

                  supabase_upsert(
                      match
                  )


                  updated += 1


                  # ----------------------------------------------------
                  # LOG
                  # ----------------------------------------------------

                  score = (
                      f"{home_score} - "
                      f"{away_score}"
                  )

                  print(
                      f"✓ {home_team} - "
                      f"{away_team} | "
                      f"{score} | "
                      f"{db_status}"
                  )


              except Exception as error:

                  errors += 1

                  print(
                      f"✗ Error procesando "
                      f"partido: {error}"
                  )


          # ============================================================
          # FINISH
          # ============================================================

          print("")
          print("========================================")
          print("SINCRONIZACIÓN TERMINADA")
          print("========================================")

          print(
              f"Partidos actualizados: {updated}"
          )

          print(
              f"Errores: {errors}"
          )

          print("")

          if errors > 0:

              print(
                  "⚠️ Algunos partidos "
                  "no pudieron actualizarse."
              )

          else:

              print(
                  "✅ Todos los partidos "
                  "se procesaron correctamente."
              )

          PY
