name: Sync La Liga results

on:
  schedule:
    # Ejecutar una vez cada hora
    - cron: "0 * * * *"

  # Permite ejecutarlo manualmente
  workflow_dispatch:

concurrency:
  group: laliga-results-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Sync football-data.org → Supabase
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          SUPABASE_URL: https://mmrctzpiyycgoiqldtlg.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |
          python - <<'PY'

          import json
          import os
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone


          # ============================================================
          # CONFIGURACIÓN
          # ============================================================

          API_URL = "https://api.football-data.org/v4"

          # La Liga
          COMPETITION = "PD"

          TOKEN = os.environ["FOOTBALL_DATA_TOKEN"]

          SUPABASE_URL = os.environ["SUPABASE_URL"]

          SUPABASE_KEY = os.environ["SUPABASE_SERVICE_ROLE_KEY"]


          # ============================================================
          # GET FOOTBALL-DATA.ORG
          # ============================================================

          def football_data_get(endpoint, params=None):

              if params is None:
                  params = {}

              query = urllib.parse.urlencode(params)

              url = API_URL + endpoint

              if query:
                  url += "?" + query

              request = urllib.request.Request(
                  url,
                  headers={
                      "X-Auth-Token": TOKEN,
                      "Accept": "application/json"
                  },
                  method="GET"
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  return json.loads(
                      response.read().decode()
                  )


          # ============================================================
          # SUPABASE
          # ============================================================

          def supabase_request(
              endpoint,
              method="GET",
              data=None,
              extra_headers=None
          ):

              url = SUPABASE_URL + endpoint

              headers = {
                  "apikey": SUPABASE_KEY,
                  "Authorization": "Bearer " + SUPABASE_KEY,
                  "Content-Type": "application/json"
              }

              if extra_headers:
                  headers.update(extra_headers)

              body = None

              if data is not None:
                  body = json.dumps(data).encode()

              request = urllib.request.Request(
                  url,
                  data=body,
                  headers=headers,
                  method=method
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  content = response.read()

                  if not content:
                      return None

                  return json.loads(
                      content.decode()
                  )


          # ============================================================
          # START
          # ============================================================

          print("")
          print("========================================")
          print("       LA LIGA RESULTS SYNC")
          print("       football-data.org → Supabase")
          print("========================================")
          print("")

          print("Consultando La Liga...")
          print("Competition: PD")
          print("Season: ACTIVE")
          print("")


          # ============================================================
          # GET ACTIVE SEASON MATCHES
          # ============================================================

          data = football_data_get(
              f"/competitions/{COMPETITION}/matches"
          )


          matches = data.get(
              "matches",
              []
          )


          print(
              f"Partidos recibidos: {len(matches)}"
          )

          print("")


          if not matches:

              raise Exception(
                  "football-data.org no devolvió partidos."
              )


          # ============================================================
          # PROCESS MATCHES
          # ============================================================

          updated = 0

          errors = 0


          for match in matches:

              try:

                  match_id = match.get("id")

                  home_team = (
                      match
                      .get("homeTeam", {})
                      .get("name")
                  )

                  away_team = (
                      match
                      .get("awayTeam", {})
                      .get("name")
                  )

                  matchday = match.get(
                      "matchday"
                  )

                  utc_date = match.get(
                      "utcDate"
                  )

                  api_status = match.get(
                      "status",
                      "SCHEDULED"
                  )


                  # ----------------------------------------------------
                  # SCORE
                  # ----------------------------------------------------

                  score = match.get(
                      "score",
                      {}
                  )

                  full_time = score.get(
                      "fullTime",
                      {}
                  )

                  home_score = full_time.get(
                      "home"
                  )

                  away_score = full_time.get(
                      "away"
                  )


                  # ----------------------------------------------------
                  # STATUS
                  # ----------------------------------------------------

                  if api_status in [
                      "FINISHED",
                      "AWARDED"
                  ]:

                      db_status = "FINISHED"

                  elif api_status in [
                      "IN_PLAY",
                      "PAUSED",
                      "LIVE"
                  ]:

                      db_status = "IN_PLAY"

                  elif api_status == "POSTPONED":

                      db_status = "POSTPONED"

                  elif api_status in [
                      "CANCELLED",
                      "SUSPENDED"
                  ]:

                      db_status = "CANCELED"

                  else:

                      db_status = "SCHEDULED"


                  # ----------------------------------------------------
                  # DATA TO SAVE
                  # ----------------------------------------------------

                  row = {

                      "api_id":
                          match_id,

                      "matchday":
                          matchday,

                      "home_team":
                          home_team,

                      "away_team":
                          away_team,

                      "utc_date":
                          utc_date,

                      "status":
                          db_status,

                      "home_score":
                          home_score,

                      "away_score":
                          away_score,

                      "updated_at":
                          datetime.now(
                              timezone.utc
                          ).isoformat()
                  }


                  # ----------------------------------------------------
                  # UPSERT
                  # ----------------------------------------------------

                  supabase_request(
                      "/rest/v1/matches"
                      "?on_conflict=api_id",

                      method="POST",

                      data=row,

                      extra_headers={
                          "Prefer":
                          "resolution=merge-duplicates,"
                          "return=minimal"
                      }
                  )


                  updated += 1


                  # ----------------------------------------------------
                  # LOG
                  # ----------------------------------------------------

                  if (
                      home_score is not None
                      and away_score is not None
                  ):

                      score_text = (
                          f"{home_score} - "
                          f"{away_score}"
                      )

                  else:

                      score_text = "-"


                  print(
                      f"✓ {home_team} - "
                      f"{away_team} | "
                      f"{score_text} | "
                      f"{db_status}"
                  )


              except Exception as error:

                  errors += 1

                  print(
                      f"✗ Error procesando "
                      f"{home_team} - "
                      f"{away_team}: "
                      f"{error}"
                  )


          # ============================================================
          # FIN
          # ============================================================

          print("")
          print("========================================")
          print("SINCRONIZACIÓN TERMINADA")
          print("========================================")

          print(
              f"Partidos procesados: {updated}"
          )

          print(
              f"Errores: {errors}"
          )

          print("")

          if errors == 0:

              print(
                  "✅ Todo correcto."
              )

          else:

              print(
                  "⚠️ Hay partidos con errores."
              )

          PY
