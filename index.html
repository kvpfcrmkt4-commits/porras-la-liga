<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Porra La Liga 2026/27</title><style>body{font-family:system-ui;margin:0;background:#f4f6fa;color:#172033}header{background:#111827;color:#fff;padding:24px}main{max-width:1000px;margin:20px auto;padding:0 14px}.card{background:#fff;padding:20px;border-radius:14px;margin-bottom:18px;border:1px solid #e3e7ef}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}button,input,select{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid #d9dee8}button{background:#2563eb;color:#fff;border:0;font-weight:700;cursor:pointer}.hidden{display:none}.tabs{display:flex;gap:8px;margin-bottom:18px}.match{display:grid;grid-template-columns:1fr 58px 58px 1fr 150px;gap:9px;align-items:center;padding:13px 0;border-bottom:1px solid #edf0f4}.away{text-align:right}.score{width:45px;text-align:center;font-weight:800}.status{text-align:center;font-size:12px;font-weight:800}.future{color:#667085}.live{color:#b42318}.final{color:#16834b}.exact{color:#16834b;font-weight:900}.one{color:#a66b00;font-weight:900}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #edf0f4;text-align:center}th:nth-child(2),td:nth-child(2){text-align:left}.notice{background:#fff8e6;color:#7a4b00;padding:12px;border-radius:9px;margin:12px 0}@media(max-width:700px){.match{grid-template-columns:1fr 48px 48px 1fr}.match .status{grid-column:1/-1}}</style></head><body><header><h1>⚽ Porra La Liga 2026/27</h1><p>3 puntos exacto · 1 punto resultado · 0 fallo</p></header><main><div id="login" class="card"><h2>👋 Entra en la porra</h2><p>Escribe tu nombre. Tus predicciones se guardan en la porra compartida.</p><div class="row"><input id="player" maxlength="30" placeholder="Tu nombre"><button onclick="enter()">Entrar</button></div></div><div id="app" class="hidden"><div class="tabs"><button onclick="show('games',this)">⚽ Jornada</button><button onclick="show('ranking',this)">🏆 Clasificación</button><button onclick="logout()">Cambiar jugador</button></div><section id="games"><div class="card"><div class="row" style="justify-content:space-between"><h2 id="title">Jornada</h2><select id="round" onchange="render()"></select></div><div id="sync" class="muted"></div><div class="notice">🔒 La predicción se bloquea automáticamente al comenzar el partido.</div><div id="matches"></div></div></section><section id="ranking" class="hidden"><div class="card"><h2>🏆 Clasificación</h2><div id="standings"></div></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://mmrctzpiyycgoiqldtlg.supabase.co';
const SUPABASE_KEY='sb_publishable_FV-CQzkjH2ob5rHpN2GEGQ_R7Pbi0aG';
const SYNC_FUNCTION=SUPABASE_URL+'/functions/v1/sync-sofascore';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let player=localStorage.getItem('porra_player')||'',matches=[],round=1;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function enter(){const n=document.getElementById('player').value.trim();if(!n)return alert('Introduce tu nombre.');player=n;localStorage.setItem('porra_player',n);start()}
function logout(){localStorage.removeItem('porra_player');location.reload()}
async function start(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');await sync();await load();setInterval(async()=>{await sync();await load()},300000)}
async function sync(){try{const r=await fetch(SYNC_FUNCTION+'?fromRound='+round+'&toRound='+Math.min(round+1,38),{method:'POST',headers:{'Authorization':'Bearer '+SUPABASE_KEY}});if(!r.ok)throw Error(await r.text());document.getElementById('sync').textContent='🔄 Resultados sincronizados · '+new Date().toLocaleTimeString('es-ES')}catch(e){document.getElementById('sync').textContent='⚠️ No se pudo sincronizar ahora'}}
async function load(){const q=await db.from('matches').select('*').order('matchday').order('utc_date');matches=q.data||[];const days=[...new Set(matches.map(x=>x.matchday))];if(days.length&&!days.includes(round))round=days[0];document.getElementById('round').innerHTML=days.map(x=>`<option value="${x}" ${x==round?'selected':''}>Jornada ${x}</option>`).join('');render()}
function out(h,a){return h>a?'H':h<a?'A':'D'}
function pts(p,m){if(!p||m.home_score==null||m.away_score==null)return null;if(p.home_pred===m.home_score&&p.away_pred===m.away_score)return 3;return out(p.home_pred,p.away_pred)===out(m.home_score,m.away_score)?1:0}
function locked(m){return new Date(m.utc_date).getTime()<=Date.now()||['IN_PLAY','LIVE','PAUSED','FINISHED'].includes(m.status)}
function state(m){if(m.status==='FINISHED')return '<span class="final">🟢 FINAL</span>';if(['IN_PLAY','LIVE','PAUSED'].includes(m.status))return '<span class="live">🔴 EN DIRECTO</span>';return '<span class="future">⚪ '+new Date(m.utc_date).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+'</span>'}
async function render(){round=Number(document.getElementById('round').value||round);const ms=matches.filter(m=>m.matchday===round);document.getElementById('title').textContent='Jornada '+round;if(!ms.length){document.getElementById('matches').innerHTML='<p>No hay partidos cargados todavía.</p>';return}const q=await db.from('predictions').select('*').eq('player',player).in('match_id',ms.map(m=>m.id));const p=Object.fromEntries((q.data||[]).map(x=>[x.match_id,x]));document.getElementById('matches').innerHTML=ms.map(m=>{const x=p[m.id],l=locked(m),v=pts(x,m);return `<div class="match"><div>${esc(m.home_team)}</div><input id="h${m.id}" class="score" type="number" min="0" value="${x?.home_pred??''}" ${l?'disabled':''} onchange="save(${m.id})"><input id="a${m.id}" class="score" type="number" min="0" value="${x?.away_pred??''}" ${l?'disabled':''} onchange="save(${m.id})"><div class="away">${esc(m.away_team)}</div><div class="status">${state(m)}${m.home_score!=null?`<br><b>${m.home_score} - ${m.away_score}</b>`:''}<br>${v===3?'<span class="exact">+3 exacto</span>':v===1?'<span class="one">+1 resultado</span>':v===0?'<span>0 puntos</span>':l?'🔒':''}</div></div>`}).join('')}
async function save(id){const m=matches.find(x=>x.id===id);if(!m||locked(m))return;const h=document.getElementById('h'+id).value,a=document.getElementById('a'+id).value;if(h===''||a==='')return;const r=await db.from('predictions').upsert({match_id:id,player,home_pred:Number(h),away_pred:Number(a)},{onConflict:'match_id,player'});if(r.error)alert(r.error.message);await render()}
async function ranking(){const [p,m]=await Promise.all([db.from('predictions').select('*'),db.from('matches').select('*')]);const t={};(p.data||[]).forEach(x=>{const z=(m.data||[]).find(y=>y.id===x.match_id),v=pts(x,z);if(v!=null)t[x.player]=(t[x.player]||0)+v});const a=Object.entries(t).sort((x,y)=>y[1]-x[1]);document.getElementById('standings').innerHTML='<table><tr><th>#</th><th>Jugador</th><th>Puntos</th></tr>'+a.map((x,i)=>`<tr><td>${i+1}</td><td>${i?'':'🏆 '}${esc(x[0])}</td><td><b>${x[1]}</b></td></tr>`).join('')+'</table>'}
function show(id,b){document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='ranking')ranking()}
if(player){document.getElementById('player').value=player;start()}
</script></body></html>
