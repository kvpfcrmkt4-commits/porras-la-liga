<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Porra La Liga 2026/27</title><style>:root{--bg:#f4f6fa;--card:#fff;--ink:#172033;--muted:#667085;--line:#e4e7ec;--blue:#2563eb;--green:#16834b;--red:#b42318;--gold:#a66b00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#101828;color:#fff;padding:24px max(18px,calc((100% - 1050px)/2))}header h1{margin:0 0 4px;font-size:28px}header p{margin:0;color:#c7ced9}.wrap{max-width:1050px;margin:22px auto;padding:0 14px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:20px;margin-bottom:18px;box-shadow:0 4px 15px #1018280b}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}button,input,select{font:inherit;padding:10px 12px;border:1px solid #d8dee8;border-radius:9px}button{background:var(--blue);color:#fff;border:0;font-weight:700;cursor:pointer}button.secondary{background:#eef2ff;color:#2449b8}.hidden{display:none}.muted{color:var(--muted);font-size:13px}.notice{background:#fff8e6;color:#7a4b00;padding:12px 14px;border-radius:10px;margin:14px 0}.match{display:grid;grid-template-columns:1fr 58px 58px 1fr 155px;gap:9px;align-items:center;padding:13px 0;border-bottom:1px solid #edf0f4}.away{text-align:right}.score{width:58px;text-align:center;font-weight:800}.status{text-align:center;font-size:12px;font-weight:800}.future{color:var(--muted)}.live{color:var(--red)}.final{color:var(--green)}.exact{color:var(--green);font-weight:900}.one{color:var(--gold);font-weight:900}.empty{text-align:center;padding:28px;color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{padding:11px 8px;border-bottom:1px solid #edf0f4;text-align:center}th:nth-child(2),td:nth-child(2){text-align:left}.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs button{flex:1}@media(max-width:700px){.match{grid-template-columns:1fr 50px 50px 1fr}.match .status{grid-column:1/-1}.score{width:50px;padding:8px 3px}}</style></head><body><header><h1>⚽ Porra La Liga 2026/27</h1><p>Marcador exacto = 3 puntos · Resultado correcto = 1 punto · Fallo = 0</p></header><div class="wrap"><div id="login" class="card"><h2>👋 Entra en la porra</h2><p class="muted">Escribe tu nombre. Todos los jugadores usan esta misma web.</p><div class="row"><input id="name" maxlength="30" placeholder="Tu nombre"><button onclick="enter()">Entrar</button></div></div><div id="app" class="hidden"><div class="tabs"><button onclick="tab('games',this)">⚽ Jornada</button><button onclick="tab('ranking',this)">🏆 Clasificación</button><button class="secondary" onclick="changePlayer()">Cambiar jugador</button></div><section id="games"><div class="card"><div class="row between"><div><h2 id="roundTitle">Jornada</h2><span id="playerLabel" class="muted"></span></div><select id="round" onchange="render()"></select></div><div id="syncMessage" class="muted" style="margin-top:8px"></div><div class="notice">🔒 Las predicciones se bloquean automáticamente al comenzar cada partido.</div><div id="matches"></div></div></section><section id="ranking" class="hidden"><div class="card"><h2>🏆 Clasificación</h2><div id="standings"></div></div></section></div></div><script>
const SUPABASE_URL="https://mmrctzpiyycgoiqldtlg.supabase.co",SUPABASE_KEY="sb_publishable_FV-CQzkjH2ob5rHpN2GEGQ_R7Pbi0aG",FUNCTION="sync-sofascore-v2";let player=localStorage.getItem("porra_player")||"",matches=[],currentRound=1,syncing=false,firstSync=true;
async function api(path,opts={}){const r=await fetch(SUPABASE_URL+path,{...opts,headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json",...(opts.headers||{})}});if(!r.ok)throw Error(await r.text());return r.json()}
async function invoke(body){const r=await fetch(SUPABASE_URL+"/functions/v1/"+FUNCTION,{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify(body||{})});const t=await r.text();if(!r.ok)throw Error(t);return JSON.parse(t)}
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}function enter(){const n=document.getElementById("name").value.trim();if(!n)return alert("Escribe tu nombre.");player=n;localStorage.setItem("porra_player",n);start()}function start(){document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");document.getElementById("playerLabel").textContent="Jugador: "+player;boot()}
async function boot(){try{await load();if(!matches.length||firstSync){msg("Cargando calendario de La Liga…");await invoke({});firstSync=false;await load()}await syncRelevant();await load();setInterval(async()=>{await syncRelevant();await load()},60000)}catch(e){msg("Error: "+e.message)}}async function load(){matches=await api("/rest/v1/matches?select=*&order=matchday.asc,utc_date.asc");buildRounds()}
function buildRounds(){const days=[...new Set(matches.map(m=>m.matchday))].sort((a,b)=>a-b);if(days.length){const n=days.find(d=>matches.some(m=>m.matchday===d&&new Date(m.utc_date)>Date.now()&&m.status!=="FINISHED"));currentRound=n||days[days.length-1]}document.getElementById("round").innerHTML=days.map(d=>`<option value="${d}" ${d===currentRound?"selected":""}>Jornada ${d}</option>`).join("")}
async function syncRelevant(){if(syncing)return;syncing=true;try{if(!matches.length){await invoke({});return}const now=Date.now(),rs=[...new Set(matches.filter(m=>new Date(m.utc_date)>now-172800000&&new Date(m.utc_date)<now+864000000).map(m=>m.matchday))];if(!rs.length){const n=matches.find(m=>new Date(m.utc_date)>now);if(n)rs.push(n.matchday)}for(const r of rs.slice(0,3))await invoke({round:r});msg("Actualizado: "+new Date().toLocaleTimeString("es-ES"))}catch(e){msg("No se pudo actualizar SofaScore: "+e.message)}finally{syncing=false}}function msg(x){document.getElementById("syncMessage").textContent=x}
function outcome(h,a){return h>a?"H":h<a?"A":"D"}function points(p,m){if(!p||m.home_score===null||m.away_score===null)return null;if(p.home===m.home_score&&p.away===m.away_score)return 3;return outcome(p.home,p.away)===outcome(m.home_score,m.away_score)?1:0}function locked(m){return new Date(m.utc_date)<=new Date()||["IN_PLAY","FINISHED","CANCELED","POSTPONED"].includes(m.status)}function state(m){if(m.status==="FINISHED")return'<span class="final">🟢 FINAL</span>';if(m.status==="IN_PLAY")return'<span class="live">🔴 EN DIRECTO</span>';if(m.status==="POSTPONED")return'<span class="future">⚪ APLAZADO</span>';if(m.status==="CANCELED")return'<span class="future">⚪ CANCELADO</span>';return'<span class="future">⚪ '+new Date(m.utc_date).toLocaleString("es-ES",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})+'</span>'}
async function preds(ids){if(!ids.length)return[];return api("/rest/v1/predictions?select=*&player=eq."+encodeURIComponent(player)+"&match_id=in.("+ids.join(",")+")")}async function render(){const r=Number(document.getElementById("round").value||currentRound),ms=matches.filter(m=>m.matchday===r);document.getElementById("roundTitle").textContent="Jornada "+r;if(!ms.length){document.getElementById("matches").innerHTML='<div class="empty">Esta jornada todavía no tiene partidos.</div>';return}const ps=await preds(ms.map(m=>m.id)),map=Object.fromEntries(ps.map(p=>[p.match_id,p]));document.getElementById("matches").innerHTML=ms.map(m=>{const p=map[m.id],lock=locked(m),pt=points(p?{home:p.home_pred,away:p.away_pred}:null,m);return`<div class="match"><div>${esc(m.home_team)}</div><input id="h-${m.id}" class="score" type="number" min="0" value="${p?.home_pred??""}" ${lock?"disabled":""} onchange="savePrediction(${m.id})"><input id="a-${m.id}" class="score" type="number" min="0" value="${p?.away_pred??""}" ${lock?"disabled":""} onchange="savePrediction(${m.id})"><div class="away">${esc(m.away_team)}</div><div class="status">${state(m)}${m.home_score!==null?`<br><b>${m.home_score} - ${m.away_score}</b>`:""}<br>${pt===3?'<span class="exact">+3 exacto</span>':pt===1?'<span class="one">+1 resultado</span>':pt===0?'<span>0 puntos</span>':lock?'🔒 Bloqueada':''}</div></div>`}).join("")}
async function savePrediction(id){const m=matches.find(x=>x.id===id);if(!m||locked(m))return;const h=document.getElementById("h-"+id).value,a=document.getElementById("a-"+id).value;if(h===""||a==="")return;const r=await fetch(SUPABASE_URL+"/rest/v1/predictions?on_conflict=match_id,player",{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({match_id:id,player,home_pred:Number(h),away_pred:Number(a),updated_at:new Date().toISOString()})});if(!r.ok)alert("No se pudo guardar la predicción.");await render()}
async function ranking(){const[ps,ms]=await Promise.all([api("/rest/v1/predictions?select=*"),api("/rest/v1/matches?select=*")]),by=Object.fromEntries(ms.map(m=>[m.id,m])),tot={};ps.forEach(p=>{const v=points({home:p.home_pred,away:p.away_pred},by[p.match_id]);if(v!==null)tot[p.player]=(tot[p.player]||0)+v});const a=Object.entries(tot).sort((x,y)=>y[1]-x[1]);document.getElementById("standings").innerHTML=a.length?`<table><tr><th>#</th><th>Jugador</th><th>Puntos</th></tr>${a.map((x,i)=>`<tr><td>${i+1}</td><td>${i===0?"🏆 ":""}${esc(x[0])}</td><td><b>${x[1]}</b></td></tr>`).join("")}</table>`:'<div class="empty">Todavía no hay puntos.</div>'}function tab(id,b){document.getElementById("games").classList.toggle("hidden",id!=="games");document.getElementById("ranking").classList.toggle("hidden",id!=="ranking");if(id==="ranking")ranking();else render()}function changePlayer(){localStorage.removeItem("porra_player");location.reload()}if(player){document.getElementById("name").value=player;start()}
</script></body></html>
