<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Porra La Liga 2026/27</title>
<style>
:root{--blue:#2563eb;--dark:#172554;--bg:#f1f5f9;--green:#16a34a;--red:#dc2626;--border:#e2e8f0}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:#172033}
header{background:var(--dark);color:#fff;padding:28px 20px}.header-inner,.container{max-width:1100px;margin:auto}.container{padding:22px 15px}
header h1{margin:0 0 5px;font-size:30px}header p{margin:0;opacity:.85}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:18px}.tab{border:0;border-radius:10px;padding:13px;font-size:16px;font-weight:700;cursor:pointer;background:#dbeafe;color:#1e40af}.tab.active{background:var(--blue);color:#fff}
.card{background:#fff;border-radius:15px;box-shadow:0 3px 14px rgba(15,23,42,.07);overflow:hidden}.card-header{padding:20px;border-bottom:1px solid var(--border)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}.card-header h2{margin:0 0 5px}.player-line{color:#64748b;margin-top:8px}
.round-select{padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:#fff}.info,.status-message{padding:12px 15px;border-radius:10px;margin-bottom:15px}.info{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}.status-message{background:#eff6ff;color:#1d4ed8}
.match{display:grid;grid-template-columns:minmax(0,1fr) 90px 90px minmax(0,1fr) 150px;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.team{font-weight:600}.home{text-align:right}.away{text-align:left}.score-input{width:72px;height:45px;border:1px solid #cbd5e1;border-radius:9px;text-align:center;font-size:20px;font-weight:700}
.score-input:disabled{background:#f1f5f9;color:#64748b}.match-status{text-align:center;font-size:13px;font-weight:700}.final{color:var(--green)}.live{color:var(--red)}.future{color:#64748b}.locked,.saved{display:block;font-size:12px;margin-top:2px}.locked{color:#64748b}.saved{color:var(--green)}.real-score{display:block;margin-top:3px;font-size:13px;color:#111827}
.empty{padding:40px;text-align:center;color:#64748b}.ranking{width:100%;border-collapse:collapse}.ranking th,.ranking td{padding:14px 16px;border-bottom:1px solid var(--border);text-align:left}.ranking th{background:#f8fafc}.ranking td:last-child,.ranking th:last-child{text-align:right}.points{font-weight:800;font-size:18px}.my-player{background:#eff6ff}
@media(max-width:800px){.tabs{grid-template-columns:1fr}.match{grid-template-columns:1fr 55px 55px 1fr;gap:6px;padding:12px 10px}.match-status{grid-column:1/-1}.score-input{width:50px;height:40px}header h1{font-size:24px}}
</style>
</head>
<body>
<header><div class="header-inner"><h1>⚽ Porra La Liga 2026/27</h1><p>Marcador exacto = 3 puntos · Resultado correcto = 1 punto · Fallo = 0</p></div></header>
<div class="container">
<div class="tabs">
<button id="tabRound" class="tab active" onclick="showRound()">⚽ Jornada</button>
<button id="tabRanking" class="tab" onclick="showRanking()">🏆 Clasificación</button>
<button class="tab" onclick="changePlayer()">Cambiar jugador</button>
</div>

<section id="roundView"><div class="card"><div class="card-header">
<div class="toolbar"><div><h2 id="roundTitle">Jornada</h2><div class="player-line">Jugador: <strong id="playerName"></strong></div></div><select id="roundSelect" class="round-select" onchange="changeRound()"></select></div>
<div id="message" class="status-message" style="display:none"></div>
<div class="info">🔒 Las predicciones se bloquean automáticamente cuando comienza cada partido.</div>
</div><div id="matches"></div></div></section>

<section id="rankingView" style="display:none"><div class="card"><div class="card-header"><h2>🏆 Clasificación</h2><div class="player-line">Los puntos se calculan automáticamente.</div></div><div id="ranking"></div></div></section>
</div>

<script>
const SUPABASE_URL="https://mmrctzpiyycgoiqldtlg.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1tcmN0enBpeXljZ29pcWxkdGxnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNDg4OTMsImV4cCI6MjEwMjcyNDg5M30.1VXHbFRoTBGpHcQJHU30b1DjVWoUpkul4CjzxGoxYhs";

let player=localStorage.getItem("porra_player")||"",matches=[],predictions=[],currentRound=1;

async function api(path,options={}){
 const r=await fetch(SUPABASE_URL+path,{...options,headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json",...(options.headers||{})}});
 if(!r.ok)throw new Error(await r.text());
 const t=await r.text();return t?JSON.parse(t):null;
}
function ensurePlayer(){if(player)return;player=(prompt("Introduce tu nombre:")||"Jugador").trim()||"Jugador";localStorage.setItem("porra_player",player)}
function changePlayer(){const n=prompt("Introduce tu nombre:",player);if(!n)return;player=n.trim();if(!player)return;localStorage.setItem("porra_player",player);renderAll()}
async function loadMatches(){matches=await api("/rest/v1/matches?select=*&order=matchday.asc,utc_date.asc");if(!Array.isArray(matches))matches=[]}
async function loadPredictions(){predictions=await api("/rest/v1/predictions?select=*");if(!Array.isArray(predictions))predictions=[]}
function matchDate(m){return new Date(m.utc_date)}
function isStarted(m){const s=String(m.status||"").toUpperCase();return ["IN_PLAY","LIVE","PAUSED","FINISHED","CANCELED","POSTPONED","AWARDED"].includes(s)||matchDate(m)<=new Date()}
function state(m){const s=String(m.status||"").toUpperCase();if(["FINISHED","AWARDED"].includes(s))return"finished";if(["IN_PLAY","LIVE","PAUSED"].includes(s))return"live";if(["CANCELED","POSTPONED"].includes(s))return"special";if(matchDate(m)<=new Date())return"live";return"future"}
function determineRound(){const r=[...new Set(matches.map(m=>Number(m.matchday)).filter(Boolean))].sort((a,b)=>a-b);if(!r.length){currentRound=1;return}const a=r.find(x=>matches.some(m=>Number(m.matchday)===x&&(state(m)==="future"||state(m)==="live")));currentRound=a||r[r.length-1]}
function buildRounds(){const s=document.getElementById("roundSelect"),r=[...new Set(matches.map(m=>Number(m.matchday)).filter(Boolean))].sort((a,b)=>a-b);s.innerHTML="";r.forEach(x=>{const o=document.createElement("option");o.value=x;o.textContent="Jornada "+x;o.selected=x===currentRound;s.appendChild(o)})}
function changeRound(){currentRound=Number(document.getElementById("roundSelect").value);renderRound()}
function getPrediction(id){return predictions.find(p=>Number(p.match_id)===Number(id)&&String(p.player).toLowerCase()===String(player).toLowerCase())}
async function savePrediction(id,h,a){
 const m=matches.find(x=>Number(x.id)===Number(id));if(!m)return;
 if(isStarted(m)){alert("🔒 Este partido ya ha comenzado.");renderRound();return}
 const hs=Number(h),as=Number(a);if(!Number.isInteger(hs)||!Number.isInteger(as)||hs<0||as<0)return;
 try{
  await api("/rest/v1/predictions?on_conflict=match_id,player",{method:"POST",headers:{"Prefer":"resolution=merge-duplicates"},body:JSON.stringify({match_id:Number(id),player,home_pred:hs,away_pred:as,updated_at:new Date().toISOString()})});
  await loadPredictions();renderRound();
 }catch(e){alert("No se pudo guardar la predicción.\n\n"+e.message)}
}
function inputChanged(id){const h=document.querySelector(`[data-home="${id}"]`),a=document.querySelector(`[data-away="${id}"]`);if(h&&a&&h.value!==""&&a.value!=="")savePrediction(id,h.value,a.value)}
function fmt(d){return new Intl.DateTimeFormat("es-ES",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}).format(d)}
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function renderRound(){
 document.getElementById("roundTitle").textContent="Jornada "+currentRound;document.getElementById("playerName").textContent=player;
 const c=document.getElementById("matches"),rm=matches.filter(m=>Number(m.matchday)===currentRound);
 if(!rm.length){c.innerHTML='<div class="empty">No hay partidos en esta jornada.</div>';return}
 c.innerHTML=rm.map(m=>{
  const st=state(m),lock=isStarted(m),p=getPrediction(m.id),hp=p?p.home_pred:"",ap=p?p.away_pred:"";let sh="";
  if(st==="finished")sh=`<span class="final">🟢 FINAL</span><span class="real-score">${m.home_score??"-"} - ${m.away_score??"-"}</span><span class="locked">🔒 Bloqueada</span>`;
  else if(st==="live")sh=`<span class="live">🔴 EN DIRECTO</span>${m.home_score!=null?`<span class="real-score">${m.home_score} - ${m.away_score}</span>`:""}<span class="locked">🔒 Bloqueada</span>`;
  else if(st==="special")sh=`<span class="future">⚪ ${String(m.status||"").toUpperCase()}</span><span class="locked">🔒 No disponible</span>`;
  else sh=`<span class="future">⚪ ${fmt(matchDate(m))}</span>`;
  return `<div class="match"><div class="team home">${esc(m.home_team)}</div><div><input class="score-input" type="number" min="0" max="30" value="${hp}" data-home="${m.id}" ${lock?"disabled":""} onchange="inputChanged(${m.id})"></div><div><input class="score-input" type="number" min="0" max="30" value="${ap}" data-away="${m.id}" ${lock?"disabled":""} onchange="inputChanged(${m.id})"></div><div class="team away">${esc(m.away_team)}</div><div class="match-status">${sh}${p?'<span class="saved">✓ Predicción guardada</span>':""}</div></div>`;
 }).join("");
}
function outcome(h,a){return h>a?"H":h<a?"A":"D"}
function points(p,m){
 if(m.home_score==null||m.away_score==null)return 0;
 if(Number(p.home_pred)===Number(m.home_score)&&Number(p.away_pred)===Number(m.away_score))return 3;
 return outcome(Number(p.home_pred),Number(p.away_pred))===outcome(Number(m.home_score),Number(m.away_score))?1:0;
}
async function renderRanking(){
 const c=document.getElementById("ranking");if(!predictions.length){c.innerHTML='<div class="empty">Todavía no hay predicciones.</div>';return}
 const t={};predictions.forEach(p=>{const m=matches.find(x=>Number(x.id)===Number(p.match_id));if(!m)return;const n=String(p.player).trim();if(!n)return;t[n]=(t[n]||0)+points(p,m)});
 const r=Object.entries(t).map(([name,points])=>({name,points})).sort((a,b)=>b.points-a.points||a.name.localeCompare(b.name,"es"));
 c.innerHTML=r.length?`<table class="ranking"><thead><tr><th>#</th><th>Jugador</th><th>Puntos</th></tr></thead><tbody>${r.map((x,i)=>`<tr class="${x.name.toLowerCase()===player.toLowerCase()?"my-player":""}"><td>${i+1}</td><td>${esc(x.name)}</td><td class="points">${x.points}</td></tr>`).join("")}</tbody></table>`:'<div class="empty">Todavía no hay puntos.</div>';
}
function showRound(){document.getElementById("roundView").style.display="block";document.getElementById("rankingView").style.display="none";document.getElementById("tabRound").classList.add("active");document.getElementById("tabRanking").classList.remove("active");renderRound()}
async function showRanking(){document.getElementById("roundView").style.display="none";document.getElementById("rankingView").style.display="block";document.getElementById("tabRound").classList.remove("active");document.getElementById("tabRanking").classList.add("active");await loadPredictions();renderRanking()}
async function refresh(){
 try{await loadMatches();await loadPredictions();determineRound();buildRounds();renderRound();const msg=document.getElementById("message");msg.style.display="block";msg.textContent="✓ Datos sincronizados desde Supabase.";setTimeout(()=>msg.style.display="none",3000)}
 catch(e){const msg=document.getElementById("message");msg.style.display="block";msg.textContent="Error al cargar los datos: "+e.message}
}
function renderAll(){document.getElementById("playerName").textContent=player;buildRounds();renderRound()}
async function boot(){ensurePlayer();document.getElementById("playerName").textContent=player;await refresh();setInterval(async()=>{try{await loadMatches();await loadPredictions();buildRounds();renderRound()}catch(e){}},60000)}
boot();
</script>
</body>
</html>
